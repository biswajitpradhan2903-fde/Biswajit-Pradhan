<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biswajit Pradhan – UI/UX Developer</title>
<style>
:root{--bg:#f6f8fa;--surface:#ffffff;--ink:#14202b;--muted:#566574;--line:#d5dde4;--accent:#0b7a75;--accent-ink:#ffffff;--rail:#14213d;--rail-ink:#eef3f7;--rail-muted:#a9b8c8;--rail-accent:#7fe0d6;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d141c;--surface:#131d28;--ink:#e6edf3;--muted:#9aabbb;--line:#26343f;--accent:#5fd3c8;--accent-ink:#06221f;--rail:#0a101a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d141c;--surface:#131d28;--ink:#e6edf3;--muted:#9aabbb;--line:#26343f;--accent:#5fd3c8;--accent-ink:#06221f;--rail:#0a101a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.layout{display:grid;grid-template-columns:minmax(280px,360px) 1fr;min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);padding:48px 36px;position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:22px;overflow:auto}
.rail h1{font:700 clamp(2.4rem,4.2vw,3.4rem)/1.02 Georgia,"Iowan Old Style",serif;margin:0;letter-spacing:-.02em}
.role{color:var(--rail-accent);font-weight:600;margin:0}
.bio{color:var(--rail-muted);margin:0;font-size:.97rem}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav button{all:unset;cursor:pointer;padding:6px 0;color:var(--rail-ink);font-weight:500;border-left:2px solid transparent;padding-left:12px}
.nav button:hover{border-left-color:var(--rail-accent);color:var(--rail-accent)}
.nav button:focus-visible{outline:3px solid var(--rail-accent);outline-offset:2px}
.contact{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.contact a{color:var(--rail-accent);overflow-wrap:anywhere}
.theme{align-self:flex-start;background:transparent;color:var(--rail-ink);border:1px solid var(--rail-muted);border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit;font-size:.88rem}
main{padding:56px clamp(24px,5vw,72px) 72px;max-width:900px}
section{margin-bottom:56px}
h2{font:700 1.7rem/1.2 Georgia,"Iowan Old Style",serif;margin:0 0 20px;letter-spacing:-.01em}
dl.skills{display:grid;grid-template-columns:max-content 1fr;gap:10px 28px;margin:0}
dl.skills dt{font-weight:700;color:var(--accent)}
dl.skills dd{margin:0}
.job{display:grid;grid-template-columns:150px 1fr;gap:6px 28px;padding:20px 0;border-top:1px solid var(--line)}
.job .when{color:var(--muted);font-size:.92rem;padding-top:3px}
.job h3,.proj h3{margin:0;font-size:1.1rem}
.job .co{color:var(--muted);margin:2px 0 8px}
ul{margin:8px 0 0;padding-left:20px}
li{margin-bottom:6px}
.proj{padding:20px 0;border-top:1px solid var(--line)}
.proj .head{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between}
.proj .desc{margin:4px 0 8px;color:var(--muted)}
.proj p{margin:0 0 4px}
.edu p{margin:0 0 6px}
@media (max-width:820px){
.layout{grid-template-columns:1fr}
.rail{position:static;height:auto;padding:36px 24px}
.contact{margin-top:6px}
.job{grid-template-columns:1fr}
dl.skills{grid-template-columns:1fr;gap:2px}
dl.skills dd{margin-bottom:10px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect}=React, h=React.createElement;

const SKILLS=[
["UI/UX and design","Wireframing, prototyping, responsive and mobile-first design, design systems and component libraries, usability best practices, Figma, Adobe Photoshop, Illustrator"],
["Front-end development","React JS, JavaScript (ES6+), HTML5, CSS3, SASS/SCSS, jQuery, Bootstrap, Tailwind CSS, Flexbox and CSS Grid, cross-browser compatibility"],
["Accessibility and SEO","WCAG 2.1 (AA), semantic HTML, ARIA, canonical tags, hreflang, localisation, Core Web Vitals and page-speed optimisation"],
["CMS and platforms","Adobe Experience Manager (CQ5), SharePoint Designer"],
["Tools and workflow","Git, GitLab, VS Code, Chrome DevTools, Jira, Agile/Scrum, CI/CD basics, npm, Webpack, Vite"],
["AI-assisted development","GitHub Copilot and ChatGPT for coding, debugging, refactoring and documentation"]];

const JOBS=[
{t:"Team Lead, Web Development",c:"IDrive Software India Pvt. Ltd., Bangalore (joined as Sr. UI Developer)",d:"May 2018 – Nov 2026",b:[
"Custom video player: built a JW Player-style player in JavaScript and HTML5 with custom controls and responsive playback, so product pages had a branded, fully controllable player.",
"Feature page redesign: redesigned IDrive’s latest feature pages with SEO-friendly, responsive, WCAG-compliant layouts, using semantic HTML, canonical tags, hreflang and localisation for the US and UK sites.",
"Download automation: replaced repetitive manual download updates with a script, saving time on every release.",
"Performance: optimised page speed and Core Web Vitals, improving load times by 90%.",
"Team leadership: lead a front-end team through task planning, mentoring and code reviews, and manage testing and releases with designers and product."]},
{t:"UI/UX Developer",c:"Enaviya Information Technologies Pvt. Ltd.",d:"Oct 2015 – May 2018",b:[
"Designed and developed enterprise web UIs using HTML5, CSS3, JavaScript and jQuery.",
"Built templates and components on Adobe Experience Manager (CQ5) and SharePoint from Photoshop designs."]},
{t:"HTML Developer",c:"EDC Creative Technology Solutions Pvt. Ltd.",d:"Feb 2014 – Oct 2015",b:[
"Developed responsive, cross-browser web pages from PSD designs using HTML5, CSS3, JavaScript and jQuery."]}];

const PROJECTS=[
["IDrive","idrive.com","https://www.idrive.com/","Cloud backup and storage platform for individuals and businesses.","As Team Lead, led front-end for marketing and sign-up pages with responsive, WCAG-compliant UI, SEO and localisation."],
["IDrive 360","idrive.com/endpoint-backup","https://www.idrive.com/endpoint-backup/","Endpoint and SaaS backup for MSPs and IT teams.","As Sr. UI Developer, built B2B product and pricing pages; handled code reviews and release approvals."],
["IDrive Mirror","idrivemirror.com","https://www.idrivemirror.com/","Cloud disk-image backup and disaster recovery for Windows.","As Sr. UI Developer, built responsive plan, download and support pages."],
["IBackup","ibackup.com","https://www.ibackup.com/","Online backup service for small businesses.","As Sr. UI Developer, handled UI updates, cross-browser testing, SEO fixes and deployments."],
["RemotePC","remotepc.com","https://www.remotepc.com/","Remote desktop access software for individuals, teams and enterprises.","As UI Developer, built features, pricing and sign-up pages focused on accessibility and speed."]];

const NAV=[["skills","Skills"],["experience","Experience"],["projects","Projects"],["education","Education"]];
const go=id=>{const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})};

function App(){
  const [theme,setTheme]=useState(null);
  useEffect(()=>{const r=document.documentElement;if(theme)r.setAttribute("data-theme",theme);else r.removeAttribute("data-theme")},[theme]);
  const dark=theme?theme==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;
  return h("div",{className:"layout"},
    h("header",{className:"rail"},
      h("h1",null,"Biswajit Pradhan"),
      h("p",{className:"role"},"Senior UI/UX Developer and Front-End Team Lead"),
      h("p",{className:"bio"},"12+ years building responsive, accessible web interfaces with HTML5, CSS3/SASS, JavaScript and React. I lead front-end teams, review code and ship releases for products used worldwide."),
      h("nav",{className:"nav","aria-label":"Sections"},NAV.map(([id,l])=>h("button",{key:id,onClick:()=>go(id)},l))),
      h("div",{className:"contact"},
        h("span",null,"Bangalore, India"),
        h("a",{href:"mailto:biswajitpradhan.jobs@gmail.com"},"biswajitpradhan.jobs@gmail.com"),
        h("a",{href:"https://linkedin.com/in/biswajitpradhan-8815a348",target:"_blank",rel:"noopener noreferrer"},"linkedin.com/in/biswajitpradhan-8815a348")),
      h("button",{className:"theme",onClick:()=>setTheme(dark?"light":"dark"),"aria-pressed":dark},dark?"Switch to light theme":"Switch to dark theme")),
    h("main",null,
      h("section",{id:"skills"},h("h2",null,"Skills"),
        h("dl",{className:"skills"},SKILLS.map(([k,v])=>[h("dt",{key:k+"t"},k),h("dd",{key:k+"d"},v)]))),
      h("section",{id:"experience"},h("h2",null,"Experience"),
        JOBS.map(j=>h("article",{className:"job",key:j.t},
          h("div",{className:"when"},j.d),
          h("div",null,h("h3",null,j.t),h("p",{className:"co"},j.c),h("ul",null,j.b.map((x,i)=>h("li",{key:i},x))))))),
      h("section",{id:"projects"},h("h2",null,"Projects"),
        PROJECTS.map(([n,d,u,desc,r])=>h("article",{className:"proj",key:n},
          h("div",{className:"head"},h("h3",null,n),h("a",{href:u,target:"_blank",rel:"noopener noreferrer"},"Visit "+d)),
          h("p",{className:"desc"},desc),
          h("p",null,h("strong",null,"Responsibilities: "),r)))),
      h("section",{id:"education",className:"edu"},h("h2",null,"Education and languages"),
        h("p",null,h("strong",null,"Bachelor of Arts"),", Sirdhar University, Pilani, 2013"),
        h("p",null,h("strong",null,"Higher Diploma in Graphics and Web Designing"),", Lens Interactive, Bangalore, 2012"),
        h("p",null,h("strong",null,"Languages: "),"English, Hindi, Odia, Bengali"))));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
